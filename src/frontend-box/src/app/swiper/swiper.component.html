<swiper-container #swiper slides-per-view="3" scrollbar="true" scrollbar-hide="true" free-mode="false" css-mode="true">
    @for (currentData of shownData(); track currentData.name) {
      <swiper-slide>
        <ion-grid>
          <ion-row class="img-row">
            <ion-col size="12">
              <ion-card [class.circle-card]="roundImages()" (click)="this.elementClicked.emit(currentData)">
                <!-- loading="lazy" + decoding="async": only the ~3 visible
                     slides fetch their cover up-front. Without these, an
                     artist with 276 albums (Benjamin Blümchen) made the
                     browser try to load 276 Spotify-CDN images at once;
                     it serialises to ~6 per domain so the user stared at
                     a blank swiper for several seconds while images
                     trickled in. fetchpriority="low" tells the browser
                     these aren't render-critical so they don't fight
                     with the loading-spinner / page-chrome paints. -->
                <img draggable="false" ondragstart="return false;"
                     loading="lazy" decoding="async" fetchpriority="low"
                     src="{{currentData.imgSrc | async}}">
              </ion-card>
            </ion-col>
          </ion-row>
          <ion-row class="title-row">
            <ion-col size="12">
              <ion-card (click)="readText(currentData.name)">
                <ion-card-header>
                  <ion-card-title class="ion-text-nowrap truncate-text ion-text-center">{{currentData.name}}</ion-card-title>
                </ion-card-header>
              </ion-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </swiper-slide>
    }
  </swiper-container>
