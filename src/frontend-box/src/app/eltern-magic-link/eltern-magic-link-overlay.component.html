@if (svc.visible()) {
  <div class="magic-link-overlay" (click)="svc.close()">
    <div class="ml-card" (click)="$event.stopPropagation()">
      <img [src]="svc.qrUrl()" alt="QR-Code" class="ml-qr">
      <div class="ml-info">
        <h2>{{ texts.text('parentsTitle') }}</h2>
        <p>{{ texts.text('parentsHint') }}</p>
        <code class="ml-url">{{ svc.magicLinkUrl() }}</code>
        <p class="ml-countdown">{{ texts.text('parentsCountdown', { s: svc.countdownSeconds() }) }}</p>
        <button class="ml-close" (click)="svc.close()">{{ texts.text('parentsClose') }}</button>
      </div>
    </div>
  </div>
}
