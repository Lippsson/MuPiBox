@if (hat_active() && mupihat() !== undefined) {
  @if (mupihat().BatteryConnected === 1) {
    <!-- Battery as on a phone: outline that fills up with the charge, the number inside, a bolt while charging.
         The number comes from Bat_Percent (5 % steps, same source as before); older backends without it give
         the four buckets of Bat_SOC. -->
    <span class="battery" [class.low]="level() <= 15" [attr.aria-label]="'Battery ' + level() + ' %'">
      <span class="body">
        <span class="fill" [style.width.%]="level()"></span>
        <span class="label">
          @if (charging()) {
            <svg class="bolt" viewBox="0 0 8 12" aria-hidden="true"><path d="M5.2 0 0.6 6.6h3L2.6 12 7.6 5H4.4z" /></svg>
          }
          {{ level() }}
        </span>
      </span>
      <span class="nub"></span>
    </span>
  }
}
