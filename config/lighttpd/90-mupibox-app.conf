# MuPiBox: the app (backend-api, Node) on port 80/443 as well. The start page (/) leads to the app. (Until 5.1 it was
# the app's login with the choice of the previous admin interface, PHP - gone since, see 92-mupibox-no-php.conf.)
#
# Node takes these requests on 127.0.0.1:8201 (PROXY_PORT in backend-api request-guard.ts): whatever arrives there is
# treated as coming from the network, never as the box itself, so the routes open to the box's own processes (kiosk,
# Telegram bot) stay closed here. The app's own port 8200 stays as it is (display, Spotify's redirect address).
# (mod_proxy comes with "lighty-enable-mod proxy", 10-proxy.conf: loaded twice, lighttpd would not start)

$HTTP["url"] =~ "^/(app|api|assets|manual|text-preview|parents|eltern)(/|\?|$)" {
	proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8201 ) ) )
	# websockets too: the remote control of the display (noVNC, /app/vnc/websockify)
	proxy.header = ( "upgrade" => "enable" )
	# uploads (media, covers, backups) go straight through instead of being buffered on the SD card first
	server.stream-request-body = 2
	server.stream-response-body = 2
}

# The display's own files (its build: main-…, chunk-…, polyfills-…, styles-…, beside /assets; the theme:
# active_theme.css and /theme-data/ with its fonts and pictures): the app's preview of the texts on the display
# (/text-preview) loads them from here. They used to come from port 8200 straight, which a page opened with https may
# not frame (http) and which lets in only the box or a session its cookie reaches - the preview stayed black, or plain
# without the theme.
$HTTP["url"] =~ "^/((main|chunk|polyfills|styles)-[A-Za-z0-9]+\.(js|css)|active_theme\.css|theme-data/)" {
	proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8201 ) ) )
}

$HTTP["url"] =~ "^/(\?.*)?$" {
	url.redirect = ( "" => "/app/" )
	# (not the default 301: browsers keep that for good, the start page may change again)
	url.redirect-code = 302
}
