# MuPiBox: since 5.1 no PHP runs on the box (the previous admin interface is gone - scripts/mupibox/
# remove_legacy_admin.sh). Every .php address goes to the app - without this a .php file would be sent as it is. The
# Spotify login of a box set up before the app comes back to /spotify.php: it goes on to the app's callback, as
# spotify.php did. (mod_redirect: the first pattern that matches wins.)
$HTTP["url"] =~ "\.(php[0-9]?|phtml|phar)$" {
	url.redirect = (
		"^/spotify\.php\?(.*state=.*)$" => "/app/spotify-callback?$1",
		"" => "/app/"
	)
	url.redirect-code = 302
}
